<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Zest Club</title>
<meta name="description" content="The Mandarin Zest Club app: sessions, members and your fruit.">
<meta name="theme-color" content="#fffaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MZ Club">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="splash"><img src="icons/logo.png" alt="Mandarin Zest" width="120"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=11"></script>
<script>
  // Safety net: if the app hasn't started after 10 s (e.g. an old file stuck in the browser), offer a clean reload.
  setTimeout(function () {
    if (!document.querySelector(".splash")) return;
    document.getElementById("app").innerHTML = '<main class="login"><div class="hero"><img src="icons/logo.png" alt="" width="132"><h1>Almost there</h1><p class="muted">The app needs a quick refresh.</p></div><button class="btn block" id="hardreload">Refresh the app</button></main>';
    document.getElementById("hardreload").onclick = async function () {
      try {
        if (window.caches) { var keys = await caches.keys(); await Promise.all(keys.map(function (k) { return caches.delete(k); })); }
        if (navigator.serviceWorker) { var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function (r) { return r.unregister(); })); }
      } catch (e) {}
      location.replace(location.pathname + "?r=" + Date.now() + location.hash);
    };
  }, 10000);
</script>
</body>
</html>
